<!doctype html>
<html lang="de">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>BurgerHouse – Bestell App</title>
        <link
            rel="icon"
            type="image/svg+xml"
            href="./assets/icons/favicon.svg"
        />
        <link rel="stylesheet" href="./css/fonts.css" />
        <link rel="stylesheet" href="./css/style.css" />
        <link rel="stylesheet" href="./css/menu.css" />
        <link rel="stylesheet" href="./css/basket.css" />
        <link rel="stylesheet" href="./css/responsive.css" />

        <script defer src="./js/dishes.js"></script>
        <script defer src="./js/helper.js"></script>
        <script defer src="./js/template.js"></script>
        <script defer src="./js/script.js"></script>
    </head>
    <body onload="init()">
        <header id="top">
            <a class="logo" href="#top">
                <img src="./assets/icons/logo.svg" alt="" />
            </a>
            <button aria-label="Menu">
                <img src="./assets/icons/menu.svg" alt="" />
            </button>
        </header>

        <main>
            <section class="hero">
                <div></div>
                <img
                    src="./assets/icons/restaurant-logo.svg"
                    alt="BurgerHouse logo"
                />
            </section>

            <section class="info">
                <div>
                    <h1><span>Burger</span>House</h1>
                    <p class="rating">
                        <img src="./assets/icons/star.svg" alt="" />
                        <span>4,1</span>
                        <span>(317)</span>
                    </p>
                </div>
                <p>
                    The best of Burgers, Pizza, and Greens, all in one great
                    place.
                </p>
            </section>

            <nav class="category-nav" id="categoryNav"></nav>

            <div class="menu-area">
                <div class="menu" id="menu"></div>
                <div class="basket-column">
                    <aside id="basketDesktop"></aside>
                </div>
            </div>
        </main>

        <footer>
            <div>
                <img src="./assets/icons/copyright.svg" alt="" />
                <span>2025 BurgerHouse</span>
            </div>
            <a href="./pages/imprint.html">Imprint</a>
            <a href="./pages/cookies.html">Cookie Preferences</a>
        </footer>

        <nav class="mobile-nav">
            <a href="#top" aria-label="Home">
                <img src="./assets/icons/home.svg" alt="" />
            </a>
            <button aria-label="Profile">
                <img src="./assets/icons/profile.svg" alt="" />
            </button>
            <button aria-label="Orders">
                <img src="./assets/icons/orders.svg" alt="" />
            </button>
            <button onclick="openBasketDialog()" aria-label="Open basket">
                <img src="./assets/icons/basket.svg" alt="" />
                <span id="basketCount" hidden>0</span>
            </button>
        </nav>

        <dialog
            class="basket-dialog"
            id="basketDialog"
            onclick="closeOnBackdropClick(event)"
        >
            <div id="basketDialogContent"></div>
            <button onclick="closeBasketDialog()" aria-label="Close basket">
                <img src="./assets/icons/close.svg" alt="" />
            </button>
        </dialog>

        <dialog
            class="confirmation-dialog"
            id="confirmationDialog"
            onclick="closeOnBackdropClick(event)"
        >
            <div>
                <button
                    onclick="closeConfirmation()"
                    aria-label="Close message"
                >
                    <img src="./assets/icons/close.svg" alt="" />
                </button>
                <div>
                    <img src="./assets/icons/confirmation.svg" alt="" />
                    <h2>Order confirmed!</h2>
                    <p id="confirmationText">Your food is on the way!</p>
                </div>
            </div>
        </dialog>
    </body>
</html>
